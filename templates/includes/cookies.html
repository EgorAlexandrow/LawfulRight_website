<style>
#cookie-modal {
  display: none;
  position: fixed;
  z-index: 99999;
  left: 0;
  top: 0;
  width: 100%;
  height: 100vh;
  background-color: rgba(0, 0, 0, 0.5);
  justify-content: center;
  align-items: center;
}
.modal-content {
  background-color: white;
  margin: auto;
  padding: 16px;
  border: 1px solid #888;
  width: 80%;
  box-shadow: 0 5px 15px #000;
  text-align: center;
}
.modal-content button {
  font-size: 14px;
  padding: 8px 16px;
  border-radius: 4px;
  background-color: #2196F3;
  border: none;
  color: white;
  margin-left: 20px;
}
.modal-content button:hover {
  background-color: #bada55;
}
#cookie-modal.show {
  display: flex;
}
</style>
<div id="cookie-modal">
    <div class="modal-content">
      <h3>Политика использования куки</h3>
      <p>Наш сайт использует куки для улучшения вашего опыта. Вы можете согласиться с этим или отказаться.</p>
      <button id="accept-cookie" type="submit" class="btn btn-primary">Принять</button>
      <button id="decline-cookie" type="submit" class="btn btn-danger">Отказаться</button>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const cookieConsent = localStorage.getItem('cookie_consent');

  if (!cookieConsent) {
    document.querySelector('#cookie-modal').classList.add('show');
  }

  document.querySelector('#accept-cookie').addEventListener('click', function() {
    localStorage.setItem('cookie_consent', 'accepted');
    document.querySelector('#cookie-modal').classList.remove('show');
  });

  document.querySelector('#decline-cookie').addEventListener('click', function() {
    localStorage.setItem('cookie_consent', 'declined');
    document.querySelector('#cookie-modal').classList.remove('show');
  });
});
</script>
