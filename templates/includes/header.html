{% load static %}
<style>
.header {
    background-color: white;
    position: sticky;
    top: 0;
    padding: 0px 5px;
    z-index: 1000;
}
.toggle-menu-icon, .menu-links {
    display: none;
}
.title-logo-header {
    font-family: "IBM Plex Serif", serif;
    font-weight: 500;
    font-style: normal;
    font-size: 23px;
    color: black;
}
.navbar-brand-header {
    text-decoration: none;
    display: flex;
    align-items: center;
    text-decoration: none;
}
.address-container {
    display: flex;
    align-items: flex-start;
}
.location-icon {
    margin-right: 10px;
    align-self: center;
}
.address-text-header {
    display: flex;
    flex-direction: column;
    line-height: 1;
    color: black;
    font-family: "Evolventa", bold;
    font-weight: 500;
    font-style: bold;
    font-size: 14px;
}
.nav-link {
    color: black;
    font-family: "Evolventa", bold;
    font-weight: 500;
    font-style: bold;
    font-size: 20px;
}
.header-contact {
    color: #667CA3;
    font-family: "Evolventa", bold;
    font-weight: 500;
    font-style: bold;
    border: none;
}
.header-contact-phone {
    color: #667CA3;
    font-family: "Evolventa", bold;
    font-weight: 600;
    font-style: bold;
    font-size: 30px;
}
.header-logo {
    margin-right: 10px;
}
.schedule-header {
    color: black;
    font-size: 14px;
    line-height: 1;
}
@media (max-width: 768px) {
    .navbar-brand-header {
        flex-direction: column;
        align-items: center;
    }
    .header-logo {
        margin-right: 0;
        margin-bottom: 1px;
        width: 42px;
        height: 18px;
    }
    .title-logo-header {
        font-size: 12px;
    }
    .head-nav {
        display: none;
    }
    .header-contact {
        font-size: 14px;
        padding-right: 28px;
    }
    .toggle-menu-icon {
        display: block;
        width: 20px;
        height: 18px;
        position: absolute;
        top: 50%;
        right: 12px;
        transform: translateY(-50%);
    }
    .nav-link {
        color: black;
        font-size: 17px;
    }
    .menu-links {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        background-color: white;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        padding-bottom: 10px;
    }
    .menu-links.active {
        display: block;
    }
    .menu-links ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }
    .menu-links li {
        padding: 2px;
        text-align: center;
    }
    .schedule-header {
        font-family: "Evolventa", bold;
        font-weight: 500;
        font-style: bold;
        font-size: 7px;
    }
}
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const toggleMenuIcon = document.querySelector('.toggle-menu-icon');
        const menuLinks = document.querySelector('.menu-links');

        toggleMenuIcon.addEventListener('click', function() {
            menuLinks.classList.toggle('active');
        });
    });
</script>
