                </div>

                    <p>{{ service.text_for_popup }}</p>

                        <a href="https://github.com/ByAlexandrow/" target="_blank" class="social-link">
                            <button class="btn tg-github-vk">
                                <img src="/static/img/github-40.png" alt="GitHub">

                        <a href="https://t.me/By_Alexandrow/" target="_blank" class="social-link">
                            <button type="button" class="btn tg-github-vk">

                    <div class="footer-links">
