{% extends "base.html" %}
{% load static %}
{% block title %}Страница не найдена{% endblock %}
{% block content %}
<style>
.container-error-404 {
    text-align: center;
    padding: 50px 0; /* Добавляем отступы сверху и снизу */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
.error-404-title {
    color: #667CA3;;
    font-family: "IBM Plex Serif", serif;
    font-weight: 500;
    font-style: bold;
    text-align: center;
    font-size: 40px;
}
.error-number {
    font-size: 50px;
    color: #667CA3;
}
.error-404-description {
    color: #667CA3;
    font-size: 25px;
    font-family: "Evolventa", bold;
    font-weight: 500;
    font-style: bold;
    text-align: center;
}
.back-link {
    text-decoration: none;
}
.back-word {
    color: #667CA3;
    font-size: 24px;
    font-family: "Evolventa", bold;
    font-weight: 500;
    font-style: bold;
    text-align: center;
}
</style>
<div class="container-error-404">
    <p class="error-404-title">Страница не найдена</p>
    <p class="error-404-description">Возможно, она была временно удалена или перемещена!</p>
    <h2 class="error-number">404</h2>
    <p class="error-404-description">Разбираемся и исправляем</p>
    <a class="back-link" href="javascript:history.back()">
        <p class="back-word">>>Назад<<</p>
    </a>
</div>
{% endblock %}
